name: Build Cheese Hole

on:
  push:
    branches: [main]
    paths:
      - 'cheese-hole/**'
      - '.github/workflows/build-cheese-hole.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cheese-hole/package.json

      - run: npm install
        working-directory: cheese-hole

      - run: npm run build
        working-directory: cheese-hole

      - name: Publish build to docs/cheese-hole
        run: |
          rm -rf docs/cheese-hole
          mkdir -p docs/cheese-hole
          cp -R cheese-hole/dist/. docs/cheese-hole/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cheese-hole
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'build: publish Cheese Hole to docs [skip ci]'
          git push
